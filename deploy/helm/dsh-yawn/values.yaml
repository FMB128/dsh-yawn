# The control plane only: one dsh host, its data volume, and the tunnel Service
# runners dial. The sandbox infrastructure
# — SandboxTemplate and SandboxWarmPool — is the sandbox pool, a separate
# kustomize base in `deploy/kubernetes/runner`. See
# docs/control-plane.md.

controlPlane:
  image:
    repository: ghcr.io/zhming0/dsh-yawn-control-plane
    pullPolicy: IfNotPresent
    # Defaults to .Chart.appVersion, the matching released version.
    tag: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi
  # Extra arguments passed to the dsh web app, e.g. --trusted-host for an
  # exposure this chart does not name.
  extraArgs: []
  # Extra environment variables for the control-plane container, appended after
  # the fixed ones. This is how the control plane gets a credential it needs in
  # order to create sandboxes — the Buildkite API token, for example — from a
  # Secret you own. Such a credential must not go in the control plane's secret
  # store: that store is pushed into every sandbox before a command runs.
  extraEnv: []
  podAnnotations: {}
  podLabels: {}
  persistence:
    # The control plane keeps everything durable — sessions, credentials, the
    # seeded profile — on this volume. Disabling it swaps in an emptyDir: every
    # pod restart (including a `helm upgrade`) then loses all of that,
    # credentials store included, with nothing warning you at install time. It
    # also loses the runner token, so no existing sandbox can register again.
    # Left on by default for that reason; turn it off only for throwaway
    # installs.
    enabled: true
    size: 5Gi
    # Clusters without a default StorageClass must name one here, or the PVC
    # stays Pending.
    # storageClass: ""
  # The sandbox-manager settings, stated as the chart's own values. The chart
  # mounts the runtime slice of them — profiles, defaultProfile, idleMs,
  # expiresAfterMs, and readyTimeoutMs — as a file the control plane reads as the deployment base
  # beneath the Web UI: Settings → Sandboxes adds its own profiles and changes
  # the default and timers at runtime, without a restart, and a reset returns
  # them to what this chart configures. The profiles named here are locked on
  # that page. Unset seeds no profile: the control plane boots but cannot
  # provision a sandbox until values name one. A Kubernetes profile that omits
  # `namespace` is rendered with the release namespace; every profile must
  # target it, because the control plane's Role and the tunnel Service live
  # there. Startup settings are not part of these values; a values change
  # rolls the pod. Settings reference:
  # https://github.com/zhming0/dsh-yawn/blob/main/control-plane/README.md#settings
  sandboxManager: {}
  #  profiles:
  #    standard:
  #      backend: kas
  #      warmPool: dsh-yawn-universal
  #      # Optional; overrides the top-level idleMs for this profile.
  #      idleMs: 3600000

runner:
  # The in-cluster tunnel address handed to sandbox runners.
  # Defaults to the dsh-yawn-control-plane-tunnel Service this chart creates in
  # the release namespace; set it only for an unusual namespace or Service
  # layout.
  controlPlaneUrl: ""

# The runner token is not configured here. The control plane generates it on
# first boot, keeps it on its data volume, writes it into the
# dsh-yawn-registration-token Secret the warm pool mounts, and hands it to
# Docker and Buildkite sandboxes when it starts them.

# Browser sign-in. One mode is required; the launch-token route no longer
# exists. Passcode is the self-contained option. OIDC runs the authorization
# code flow in the control plane and accepts only the emails or domains named
# here.
auth:
  # passcode | oidc
  mode: passcode
  # At least 8 characters. Rendered into a Secret this release owns.
  passcode: ""
  # Use a Secret you already manage instead of auth.passcode.
  existingSecret: ""
  # Key in auth.existingSecret that holds the passcode.
  secretKey: passcode
  # Hostname users open, for an Ingress, Gateway, or LoadBalancer in front of
  # the control plane. Handed to dsh as --trusted-host. Required for OIDC and
  # for any non-ClusterIP Service; optional for `kubectl port-forward`, which
  # uses a loopback Host.
  hostname: ""
  oidc:
    # Authorization server issuer URL, e.g. https://idp.example/realms/acme
    issuer: ""
    clientId: ""
    # Optional for public PKCE clients.
    clientSecret: ""
    # Use a Secret you already manage instead of auth.oidc.clientSecret.
    existingSecret: ""
    clientSecretKey: clientSecret
    # Exact redirect URL registered at the issuer. Defaults to
    # https://<auth.hostname>/oidc/callback.
    redirectUrl: ""
    # At least one of these is required. Domains match the part after @
    # exactly, not subdomains.
    allowedEmails: []
    allowedDomains: []
    scope: openid email profile
    # Default true: the issuer is trusted to assert the email address, even
    # when it reports email_verified: false or omits the claim. Set false to
    # require email_verified: true.
    allowUnverifiedEmail: true

# The Service in front of the control plane's sign-in listener. ClusterIP is
# the anchor other controllers point at: an Ingress, a Gateway API route, or a
# Service of your own selecting on the pod labels. Set type LoadBalancer to
# expose it directly. Whatever fronts dsh must serve https and pass WebSockets
# and large RPC bodies — see docs/control-plane.md for an nginx-ingress example.
service:
  type: ClusterIP
  port: 80
  annotations: {}
  #  service.beta.kubernetes.io/aws-load-balancer-scheme: internal
