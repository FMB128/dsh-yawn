{{- include "dsh-yawn.validate" . }}
{{- if and (not .Values.oidc.enabled) (not .Values.controlPlane.launchToken) (not .Values.auth.existingSecret) }}
# The passcode login's credential. The chart owns this Secret when auth.passcode
# is set; auth.existingSecret keeps it in a Secret you manage instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh-yawn.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.passcode | quote }}
{{- end }}
