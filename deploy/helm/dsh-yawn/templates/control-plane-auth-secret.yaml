{{- include "dsh-yawn.validate" . }}
{{- if eq .Values.auth.mode "passcode" }}
{{- if not .Values.auth.existingSecret }}
# The passcode login's credential. The chart owns this Secret when
# auth.passcode is set; auth.existingSecret keeps it in a Secret you manage.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh-yawn.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretKey }}: {{ .Values.auth.passcode | quote }}
{{- end }}
{{- else if and (not .Values.auth.oidc.existingSecret) .Values.auth.oidc.clientSecret }}
# The OIDC client secret. Public PKCE clients and auth.oidc.existingSecret do
# not render this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dsh-yawn.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.oidc.clientSecretKey }}: {{ .Values.auth.oidc.clientSecret | quote }}
{{- end }}
