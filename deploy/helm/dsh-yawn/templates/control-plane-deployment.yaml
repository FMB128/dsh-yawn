{{- include "dsh-yawn.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-yawn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The data volume is ReadWriteOnce and dsh is a stateful single process, so
  # the old pod must release both before a new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dsh-yawn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsh-yawn.selectorLabels" . | nindent 8 }}
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # A ConfigMap mount updates in place but does not restart a pod, and
        # the control plane reads the settings once at boot, so stamp the
        # rendered values here: a change rolls the pod.
        checksum/sandbox-settings: {{ include "dsh-yawn.sandboxSettings" . | sha256sum }}
    spec:
      # The Kubernetes backend claims sandboxes with this ServiceAccount's
      # automounted token. The Role and RoleBinding ship with it, in
      # control-plane-rbac.yaml.
      serviceAccountName: dsh-yawn-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # fsGroup is what lets uid 1000 write a block-CSI volume, but its
      # permission walk also ORs group-read/write onto every file on the volume
      # at each pod start, turning dsh's owner-only credentials document
      # (/data/.dsh/.credentials.yaml, 0600) into 0660 — and dsh refuses
      # to boot on a credentials document readable beyond its owner. The walk
      # finishes before any container starts, so this runs after it and before
      # dsh, restoring owner-only mode. The `|| true` covers first boots, where
      # the document does not exist yet; if the chmod cannot succeed, dsh fails
      # on the same rule with an actionable error.
      #
      # The mkdir gives the runtime an existing /data/.dsh to hand to the
      # container, created as uid 1000 rather than by the runtime as root
      # after the fsGroup walk.
      initContainers:
        - name: fix-credentials-mode
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          command: ["sh", "-c", "mkdir -p /data/.dsh && chmod 600 /data/.dsh/.credentials.yaml || true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          {{- if or .Values.oidc.enabled .Values.controlPlane.extraArgs }}
          args:
            {{- if .Values.oidc.enabled }}
            # Built-in sign-in serves the browser-facing hostname, and dsh's
            # request fence rejects any /api request whose Host is neither
            # loopback nor an explicitly trusted authority (its defense
            # against DNS rebinding). A bare host, no scheme.
            - --trusted-host
            - {{ .Values.oidc.hostname | quote }}
            {{- end }}
            {{- with .Values.controlPlane.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            # Node >= 20 enables Happy Eyeballs and abandons each address
            # attempt after 250ms. Model API endpoints that need longer to
            # connect fail as instant ETIMEDOUT, and pod networks without an
            # IPv6 route have no working family to fall through to. 3000ms
            # keeps dual-stack failover while tolerating slow addresses.
            - name: NODE_OPTIONS
              value: --network-family-autoselection-attempt-timeout=3000
            {{- if .Values.oidc.enabled }}
            # Built-in OIDC sign-in. The Secret carries the provider
            # registration; its redirect URI must be
            # https://<hostname>/dsh-yawn/auth/callback.
            - name: DSH_YAWN_OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: OIDC_ISSUER
            - name: DSH_YAWN_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: OIDC_CLIENT_ID
            - name: DSH_YAWN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oidc.existingSecret | quote }}
                  key: OIDC_CLIENT_SECRET
            - name: DSH_YAWN_OIDC_REDIRECT_URL
              value: "https://{{ .Values.oidc.hostname }}/dsh-yawn/auth/callback"
            - name: DSH_YAWN_OIDC_EMAIL_DOMAINS
              value: {{ .Values.oidc.emailDomains | quote }}
            - name: DSH_YAWN_OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: DSH_YAWN_OIDC_CLIENT_AUTH_METHOD
              value: {{ .Values.oidc.clientAuthMethod | quote }}
            - name: DSH_YAWN_OIDC_COOKIE_MAX_AGE_DAYS
              value: {{ .Values.oidc.cookieMaxAgeDays | quote }}
            - name: DSH_YAWN_OIDC_COOKIE_SECURE
              value: "true"
            # The Service reaches the pod address; without a provider dsh
            # stays on loopback for port-forward access.
            - name: DSH_YAWN_BIND_ALL
              value: "1"
            {{- else }}
            # Mounts GET /launch-token so a port-forward user never copies the
            # startup token out of the log. No Service can reach port 3000.
            - name: DSH_YAWN_CONTROL_PLANE_LAUNCH_TOKEN_ROUTE
              value: "1"
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: tunnel
              containerPort: 8081
              protocol: TCP
          {{- if .Values.oidc.enabled }}
          # DSH_YAWN_BIND_ALL binds dsh to the pod address, so probe that
          # address. The auth row answers this route once dsh is serving; root
          # redirects to the provider and cannot be probed.
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "const os=require('node:os');const ip=Object.values(os.networkInterfaces()).flat().find((a)=>a&&a.family==='IPv4'&&!a.internal).address;fetch('http://'+ip+':3000/dsh-yawn/auth/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- else }}
          # The server binds 127.0.0.1:3000, so a TCP probe against the pod IP
          # cannot reach it; probe over loopback from inside the container.
          # An unauthenticated GET / answers 401 once dsh is serving, so that
          # status counts as ready.
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok || r.status === 401 ? 0 : 1), () => process.exit(1))"
            initialDelaySeconds: 3
            periodSeconds: 10
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The deployment's sandbox settings, as one ordinary file the
            # control plane reads at boot. Never /data/.dsh/cordis.patch.yml:
            # a dsh patch layer there would outrank the profile patch the Web
            # page writes to.
            - name: sandbox-settings
              mountPath: /etc/dsh-yawn/sandbox-settings.yaml
              subPath: sandbox-settings.yaml
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.controlPlane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dsh-yawn.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: sandbox-settings
          configMap:
            name: {{ include "dsh-yawn.fullname" . }}-sandbox-settings
