{{- include "dsh-yawn.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsh-yawn.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dsh-yawn.labels" . | nindent 4 }}
spec:
  replicas: 1
  # The data volume is ReadWriteOnce and dsh is a stateful single process, so
  # the old pod must release both before a new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "dsh-yawn.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsh-yawn.selectorLabels" . | nindent 8 }}
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.controlPlane.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # A ConfigMap mount updates in place but does not restart a pod, and
        # the control plane reads the settings once at boot, so stamp the
        # rendered values here: a change rolls the pod.
        checksum/sandbox-settings: {{ include "dsh-yawn.sandboxSettings" . | sha256sum }}
        {{- if and (eq .Values.auth.mode "passcode") (not .Values.auth.existingSecret) }}
        # The pod reads the passcode from the environment at boot, so a
        # passcode change has to roll it. A Secret you manage is rotated by you.
        checksum/auth: {{ .Values.auth.passcode | sha256sum }}
        {{- else if and (eq .Values.auth.mode "oidc") (not .Values.auth.oidc.existingSecret) .Values.auth.oidc.clientSecret }}
        # Same for a chart-owned OIDC client secret.
        checksum/auth: {{ .Values.auth.oidc.clientSecret | sha256sum }}
        {{- end }}
    spec:
      # The Kubernetes backend claims sandboxes with this ServiceAccount's
      # automounted token. The Role and RoleBinding ship with it, in
      # control-plane-rbac.yaml.
      serviceAccountName: dsh-yawn-control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # fsGroup is what lets uid 1000 write a block-CSI volume, but its
      # permission walk also ORs group-read/write onto every file on the volume
      # at each pod start, turning dsh's owner-only credentials document
      # (/data/.dsh/.credentials.yaml, 0600) into 0660 — and dsh refuses
      # to boot on a credentials document readable beyond its owner. The walk
      # finishes before any container starts, so this runs after it and before
      # dsh, restoring owner-only mode. The `|| true` covers first boots, where
      # the document does not exist yet; if the chmod cannot succeed, dsh fails
      # on the same rule with an actionable error.
      #
      # The mkdir gives the runtime an existing /data/.dsh to hand to the
      # container, created as uid 1000 rather than by the runtime as root
      # after the fsGroup walk.
      initContainers:
        - name: fix-credentials-mode
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          command: ["sh", "-c", "mkdir -p /data/.dsh && chmod 600 /data/.dsh/.credentials.yaml || true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: control-plane
          image: "{{ .Values.controlPlane.image.repository }}:{{ .Values.controlPlane.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.controlPlane.image.pullPolicy }}
          {{- if or .Values.auth.hostname .Values.controlPlane.extraArgs }}
          args:
            {{- with .Values.auth.hostname }}
            # An Ingress, Gateway, or LoadBalancer passes the browser's Host
            # through; name it so dsh's request fence accepts it. A bare host,
            # no scheme.
            - --trusted-host
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.controlPlane.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          env:
            # Node >= 20 enables Happy Eyeballs and abandons each address
            # attempt after 250ms. Model API endpoints that need longer to
            # connect fail as instant ETIMEDOUT, and pod networks without an
            # IPv6 route have no working family to fall through to. 3000ms
            # keeps dual-stack failover while tolerating slow addresses.
            - name: NODE_OPTIONS
              value: --network-family-autoselection-attempt-timeout=3000
            {{- if eq .Values.auth.mode "passcode" }}
            - name: DSH_YAWN_PASSCODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "dsh-yawn.fullname" .)) }}
                  key: {{ .Values.auth.secretKey }}
            {{- else }}
            - name: DSH_YAWN_OIDC_ISSUER
              value: {{ .Values.auth.oidc.issuer | quote }}
            - name: DSH_YAWN_OIDC_CLIENT_ID
              value: {{ .Values.auth.oidc.clientId | quote }}
            {{- if or .Values.auth.oidc.clientSecret .Values.auth.oidc.existingSecret }}
            - name: DSH_YAWN_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oidc.existingSecret | default (printf "%s-auth" (include "dsh-yawn.fullname" .)) }}
                  key: {{ .Values.auth.oidc.clientSecretKey }}
            {{- end }}
            - name: DSH_YAWN_OIDC_REDIRECT_URL
              value: {{ include "dsh-yawn.oidcRedirectUrl" . | quote }}
            {{- with .Values.auth.oidc.allowedEmails }}
            - name: DSH_YAWN_OIDC_ALLOWED_EMAILS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.auth.oidc.allowedDomains }}
            - name: DSH_YAWN_OIDC_ALLOWED_DOMAINS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: DSH_YAWN_OIDC_SCOPE
              value: {{ .Values.auth.oidc.scope | quote }}
            - name: DSH_YAWN_OIDC_ALLOW_UNVERIFIED_EMAIL
              value: {{ .Values.auth.oidc.allowUnverifiedEmail | quote }}
            {{- end }}
            # The sign-in listener binds the pod address so a Service can reach
            # it; the sign-in gate is what protects that listener.
            - name: DSH_YAWN_BIND_ALL
              value: "1"
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: tunnel
              containerPort: 8081
              protocol: TCP
          # The sign-in listener binds the pod address, not loopback. The
          # login redirect follows to a 200; a 401 still counts while dsh
          # serves without a cookie.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            # The deployment's sandbox settings, as one ordinary file the
            # control plane reads at boot. Never /data/.dsh/cordis.patch.yml:
            # a dsh patch layer there would outrank the profile patch the Web
            # page writes to.
            - name: sandbox-settings
              mountPath: /etc/dsh-yawn/sandbox-settings.yaml
              subPath: sandbox-settings.yaml
              readOnly: true
      volumes:
        - name: data
          {{- if .Values.controlPlane.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dsh-yawn.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: sandbox-settings
          configMap:
            name: {{ include "dsh-yawn.fullname" . }}-sandbox-settings
